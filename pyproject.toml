[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["socu"]

[project]
name = "socu"
version = "0.0.1"
dependencies = [
  "warp-lang>=1.14.0",
  "numpy",
  "scipy",
]
requires-python = ">=3.10"
authors = [
  {name = "Roland Schwan", email = "roland.schwan@epfl.ch"},
]
description = "socu"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICEN[CS]E.*"]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-s"]
testpaths = [
  "tests",
]
