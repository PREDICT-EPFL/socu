name: Build and upload to PyPI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published

jobs:
  tests:
    name: Tests
    # only needed as a gate for publishing; PRs and pushes already run tests.yml
    if: github.event_name == 'release'
    uses: ./.github/workflows/tests.yml

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from git tags
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build sdist and wheel
        run: pipx run build

      - name: Check metadata
        run: pipx run twine check --strict dist/*

      - name: Smoke test wheel
        run: |
          python -m pip install dist/*.whl
          cd /tmp && python -c "import socu, socu.block_tridiag_solver; print(socu.__version__)"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  upload_pypi:
    name: Upload to PyPI
    needs: [tests, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/socu
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
