name: Tests

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }}${{ matrix.min-deps && ', min deps' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.14"]
        min-deps: [false]
        include:
          # oldest supported versions of the core dependencies
          - os: ubuntu-latest
            python-version: "3.10"
            min-deps: true

    env:
      SOCU_TEST_DEVICE: cpu
      WARP_CACHE_PATH: ${{ github.workspace }}/.warp-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Pin minimum dependency versions
        if: matrix.min-deps
        run: python -m pip install "warp-lang==1.17.0" "jax==0.6.2" "jaxlib==0.6.2"

      - name: Show versions
        run: python -m pip list

      - name: Cache Warp kernels
        uses: actions/cache@v6
        with:
          path: .warp-cache
          key: warp-${{ runner.os }}-${{ matrix.python-version }}-${{ matrix.min-deps }}-${{ hashFiles('socu/**/*.py') }}
          restore-keys: |
            warp-${{ runner.os }}-${{ matrix.python-version }}-${{ matrix.min-deps }}-

      - name: Run tests
        run: python -m pytest
